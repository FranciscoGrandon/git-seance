# ===============================================================================
# 🌼🕯️ GitSéance: Digital Ofrenda Pull Request Tombstone Generator 🕯️🌼
# Creado por Francisco Grandón Vergara
# Hacktoberfest 2026 Open-Source AI Challenge: Week 4 ("Ghost in the Machine")
# ===============================================================================

name: Digital Ofrenda Tombstone Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ofrenda-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit_and_test:
    name: Verify Tests & Detect Departed Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Complete Unit Test Suite
        run: python3 -m unittest test_git_seance.py test_html_ofrenda.py test_server.py -v

      - name: Detect Departed Functions & Generate Memorial
        id: generate_memorial
        run: |
          if [ -n "${{ github.base_ref }}" ] && git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            python3 git_seance.py --ci-summary --no-fallback --range "origin/${{ github.base_ref }}..HEAD" > ofrenda_comment.md
          else
            python3 git_seance.py --ci-summary --no-fallback > ofrenda_comment.md
          fi
          echo "${{ github.event.pull_request.number }}" > pr_number.txt
          cat ofrenda_comment.md

      - name: Upload Memorial Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofrenda-comment
          path: |
            ofrenda_comment.md
            pr_number.txt
          retention-days: 2

  publish_memorial:
    name: Post Ofrenda Memorial to Pull Request
    runs-on: ubuntu-latest
    needs: audit_and_test
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Download Memorial Artifact
        uses: actions/download-artifact@v8
        with:
          name: ofrenda-comment

      - name: Post or Update Ofrenda Comment in Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ofrenda_comment.md')) {
              console.log('ℹ️ No ofrenda_comment.md artifact found.');
              return;
            }
            const commentBody = fs.readFileSync('ofrenda_comment.md', 'utf8').trim();
            if (commentBody.length === 0 || commentBody.includes('No departed functions found')) {
              console.log('ℹ️ No departed code detected in this pull request.');
              return;
            }

            const issueNumber = context.issue && context.issue.number ? context.issue.number :
              (fs.existsSync('pr_number.txt') ? parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim(), 10) : null);

            if (!issueNumber) {
              console.log('ℹ️ No pull request number identified in this context.');
              return;
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const botComment = comments.find(c =>
                c.body.includes('<!-- git-seance-ofrenda -->') ||
                c.body.includes('Digital Ofrenda Memorial — Departed Code Report')
              );
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
                console.log(`✅ Digital Ofrenda tombstone comment updated successfully (ID: ${botComment.id}).`);
              } else {
                await github.rest.issues.createComment({
                  issue_number: issueNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: commentBody
                });
                console.log('✅ Digital Ofrenda tombstone comment posted successfully.');
              }
            } catch (err) {
              if (err.status === 403) {
                console.log('⚠️ PR from external fork detected (read-only GITHUB_TOKEN). Memorial comment will be posted securely via companion workflow_run workflow.');
              } else {
                throw err;
              }
            }
