name: Digital Ofrenda Tombstone Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ofrenda_memorial:
    name: Honor Departed Code Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Departed Functions & Post Ofrenda Epitaph
        id: generate_memorial
        run: |
          if [ -n "${{ github.base_ref }}" ] && git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            python3 git_seance.py --ci-summary --no-fallback --range "origin/${{ github.base_ref }}..HEAD" > ofrenda_comment.md
          else
            python3 git_seance.py --ci-summary --no-fallback > ofrenda_comment.md
          fi
          cat ofrenda_comment.md

      - name: Post Ofrenda Comment to Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('ofrenda_comment.md')) {
              const commentBody = fs.readFileSync('ofrenda_comment.md', 'utf8').trim();
              if (commentBody.length > 0 && !commentBody.includes('No departed functions found')) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: commentBody
                });
                console.log('✅ Digital Ofrenda tombstone comment posted successfully.');
              } else {
                console.log('ℹ️ No departed code detected in this pull request.');
              }
            }
