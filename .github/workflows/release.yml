name: Publish GitHub Release & Distribution Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Release Tag Format
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            python3 -c "
          import re
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'## \[${{ steps.get_tag.outputs.TAG_NAME }}\][\s\S]*?(?=\n## \[|$)', text)
          if match:
              Path('release_notes.md').write_text(match.group(0).strip(), encoding='utf-8')
          else:
              Path('release_notes.md').write_text('Release ${{ steps.get_tag.outputs.TAG_NAME }} for GitSéance.', encoding='utf-8')
          "
          else
            echo "Automated release ${{ steps.get_tag.outputs.TAG_NAME }}" > release_notes.md
          fi
          cat release_notes.md

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          name: "GitSéance ${{ steps.get_tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            index.html
            git_seance.py
            render.yaml
            CHANGELOG.md
            LICENSE
